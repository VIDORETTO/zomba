# Contêiner que entrega o jogo (arquivos estáticos). Fica na mesma rede do Caddy da frente (meucontroleml_default),
# que cuida do HTTPS e do endereço (bloco em edge-bloco.caddy). Sobe com: docker compose -f hospedagem/docker-compose.yml up -d
name: zomba
services:
  web:
    container_name: zomba-web
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/zomba:/srv/zomba:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/__saude"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [frente]
networks:
  frente:
    name: meucontroleml_default
    external: true
